<!-- Absolute Axis - 問題反饋（feedback.js 以 DOM＋textContent 產生清單；成員送出的文字不插入 HTML） -->
<div id="view-feedback" class="view-section">
    <div class="page-wrap wide">
        <div class="page-head">
            <div>
                <p class="w-muted page-sub page-lead">回報錯誤或提出建議；管理員回覆後會顯示在這裡。</p>
            </div>
        </div>
        <div class="two-pane">
            <section class="form-card" aria-labelledby="fb-form-title">
                <h3 id="fb-form-title" class="card-h">送出反饋</h3>
                <div class="ios-group ios-form-rows">
                    <label><span>類別</span>
                        <select id="feedback-category-input">
                            <option value="Bug">系統錯誤</option>
                            <option value="Suggestion">功能建議</option>
                            <option value="Other">其他問題</option>
                        </select>
                    </label>
                    <label><span>標題</span><input type="text" id="feedback-title-input" maxlength="100" placeholder="一句話描述問題或建議"></label>
                    <label class="ta"><span>內容</span><textarea id="feedback-content-input" rows="6" placeholder="請詳細說明問題發生的情況，或具體的改進建議"></textarea></label>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="submitFeedback()">送出</button>
            </section>
            <section aria-labelledby="fb-list-title">
                <div class="list-head">
                    <h3 id="fb-list-title" class="card-h">反饋紀錄</h3>
                    <button type="button" class="round-btn sm" aria-label="重新整理" onclick="loadFeedbacks()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg></button>
                </div>
                <div id="feedbacks-list-container" class="post-list"><p class="w-muted">載入中…</p></div>
            </section>
        </div>
    </div>
</div>
