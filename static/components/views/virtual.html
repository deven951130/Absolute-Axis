<!-- Absolute Axis - 虛擬化中心（玻璃版面；設計：Claude Design「Absolute Axis 版面重設計」） -->
<div id="view-virtual" class="view-section">

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px;">
        <span class="w-muted" style="font-size: 15px; font-weight: 600;">Proxmox VE</span>
        <button class="btn btn-outline" style="margin-left: auto; padding: 9px 18px; font-size: 14px;" onclick="loadProxmoxStatus(); loadProxmoxVMs()">重新整理</button>
    </div>

    <!-- 節點狀態：圓環小工具（proxmox.js 填入） -->
    <div id="pve-node-status" class="widgets" style="grid-auto-rows: auto; margin-bottom: 20px;">
        <div class="widget" style="min-height: 140px; justify-content: center;"><span class="w-muted">載入中…</span></div>
    </div>

    <!-- 虛擬機：卡片（proxmox.js 填入） -->
    <h2 style="font-size: 20px; margin: 8px 0 12px;">虛擬機與容器</h2>
    <div id="pve-vm-list" class="vm-cards" style="margin-bottom: 28px;"></div>

    <!-- 虛擬機使用者 -->
    <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; margin-bottom: 28px;" class="vm-acc-grid">
        <section class="widget" aria-labelledby="vm-acc-h" style="min-height: 0;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <h2 id="vm-acc-h" style="margin: 0; font-size: 17px;">虛擬機使用者</h2>
                <span class="w-muted" style="font-size: 13px;">給朋友登入指定 VM 用的帳號</span>
                <button class="btn btn-outline" style="margin-left: auto; padding: 6px 14px; font-size: 13px;" onclick="loadVMAccounts()">重新整理</button>
            </div>
            <div style="overflow-x: auto; margin-top: 10px;">
                <table class="admin-table" style="font-size: 14px;">
                    <thead>
                        <tr><th>帳號</th><th>密碼</th><th>關聯 VM</th><th>描述</th><th style="text-align: right;">操作</th></tr>
                    </thead>
                    <tbody id="vm-accounts-table-body">
                        <tr><td colspan="5" style="padding: 20px; text-align: center;" class="w-muted">載入中…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="widget" aria-labelledby="vm-new-h" style="min-height: 0; gap: 12px;">
            <h2 id="vm-new-h" style="margin: 0; font-size: 17px;">新增使用者</h2>
            <div class="ios-group">
                <label><span>帳號</span><input type="text" id="vm-acc-user" placeholder="必填" autocomplete="off"></label>
                <label><span>密碼</span><input type="password" id="vm-acc-pass" placeholder="必填" autocomplete="new-password"></label>
                <label><span>VM ID</span><input type="number" id="vm-acc-vmid" placeholder="選填，例如 100"></label>
                <label><span>描述</span><input type="text" id="vm-acc-desc" placeholder="選填"></label>
            </div>
            <button class="btn btn-primary" onclick="createVMAccount()" style="height: 44px;">建立</button>
        </section>
    </div>

    <!-- Docker -->
    <section class="widget" aria-labelledby="docker-h" style="min-height: 0; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; margin-bottom: 12px;">
            <h2 id="docker-h" style="margin: 0; font-size: 17px;">Docker 容器</h2>
            <button class="btn btn-outline" style="margin-left: auto; padding: 6px 14px; font-size: 13px;" onclick="loadDocker()">重新整理</button>
        </div>
        <div id="docker-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </section>

    <!-- 選擇帳號開啟 VM 控制台 -->
    <div id="vm-console-modal" class="login-overlay" style="display: none;" onclick="if(event.target === this) closeVMConsoleModal()">
        <div style="width: 400px; max-width: calc(100vw - 32px); padding: 28px; position: relative;">
            <button type="button" onclick="closeVMConsoleModal()" aria-label="關閉" class="round-btn" style="position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            <h3 style="margin: 0 0 18px; font-size: 20px;">開啟虛擬機控制台</h3>
            <div style="display: flex; flex-direction: column; gap: 14px;">
                <label for="vm-console-user-select" class="w-muted" style="font-size: 13px;">選擇要登入的虛擬機帳號</label>
                <select id="vm-console-user-select" class="t-input" style="margin-bottom: 0;">
                    <option value="">請選擇帳號</option>
                </select>
                <div id="vm-console-credentials-display" style="display: none; background: var(--surface-2); padding: 12px 14px; border-radius: 14px; font-size: 13px; font-family: var(--font-mono);">
                    <div>帳號：<span id="vm-console-disp-user" style="color: var(--accent-color);"></span></div>
                    <div style="margin-top: 5px;">密碼：<span id="vm-console-disp-pass" style="color: var(--success-color);"></span></div>
                </div>
                <button class="btn btn-primary" id="btn-confirm-vm-console" style="width: 100%; height: 46px;" onclick="confirmOpenVMConsole()">在新分頁開啟控制台</button>
            </div>
        </div>
    </div>
</div>
