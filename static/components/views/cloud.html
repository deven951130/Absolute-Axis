<!-- Absolute Axis - 私有雲（像「檔案」App 的玻璃版面） -->
<div id="view-cloud" class="view-section">
    <div class="files-wrap widget">
        <aside class="files-side" aria-label="位置">
            <p class="files-heading">位置</p>
            <button type="button" id="nas-nav-drive" class="files-nav nas-nav active" onclick="nasNav('drive')"><span class="fn-ico" style="background:#2E9BF0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>我的雲端硬碟</button>
            <button type="button" id="nas-nav-shared" class="files-nav nas-nav" onclick="nasNav('shared')"><span class="fn-ico" style="background:#2FB463"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"></path></svg></span>與我共用</button>
            <p class="files-heading">標記</p>
            <button type="button" id="nas-nav-starred" class="files-nav nas-nav" onclick="nasNav('starred')"><span class="fn-ico" style="background:#F2B233"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></span>已加星號</button>
            <button type="button" id="nas-nav-recent" class="files-nav nas-nav" onclick="nasNav('recent')"><span class="fn-ico" style="background:#7C7C86"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span>最近使用</button>
            <button type="button" id="nas-nav-trash" class="files-nav nas-nav" onclick="nasNav('trash')"><span class="fn-ico" style="background:#FF6B62"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"></path></svg></span>最近刪除</button>
            <div class="files-quota">
                <div class="w-row" style="font-size: 13px;"><span class="w-muted">我的空間</span><span id="quota-label" class="num">0 GB / 100 GB</span></div>
                <div class="progress-bar" style="margin-top: 8px;"><div id="quota-bar" class="progress-fill" style="width: 0%;"></div></div>
            </div>
        </aside>

        <div class="files-main">
            <div class="files-toolbar">
                <div id="nas-breadcrumb" class="files-crumb">我的雲端硬碟</div>
                <div class="seg" role="group" aria-label="檢視方式">
                    <button type="button" id="btn-grid" onclick="toggleNASView('grid')" aria-label="圖示檢視"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></button>
                    <button type="button" id="btn-list" onclick="toggleNASView('list')" aria-label="列表檢視"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
                </div>
                <div class="files-new">
                    <button type="button" class="btn btn-primary" onclick="toggleNewMenu()" style="padding: 9px 18px;">＋ 新增</button>
                    <div id="new-menu" class="context-menu files-menu" style="display: none;">
                        <div class="context-menu-item" onclick="promptMkdir()" role="button" tabindex="0">新增資料夾</div>
                        <div class="context-menu-item" onclick="triggerUpload(false)" role="button" tabindex="0">上傳檔案</div>
                        <div class="context-menu-item" style="color: var(--accent-color); border-top: 1px solid var(--border-color);" onclick="triggerUpload(true)" role="button" tabindex="0">上傳並重啟服務</div>
                        <input type="file" id="nas-up" style="display: none;" onchange="nasUpload()">
                    </div>
                </div>
            </div>

            <div id="upload-monitor" class="files-upload" style="display: none;">
                <div class="w-row" style="margin-bottom: 8px;">
                    <span id="up-filename" style="font-weight: 600; color: var(--accent-color);">上傳中…</span>
                    <span id="up-speed" class="w-muted num" style="font-size: 12px;">0.0 MB/s</span>
                </div>
                <div class="progress-bar"><div id="up-bar" class="progress-fill" style="width: 0%;"></div></div>
            </div>

            <div id="nas-explorer" class="file-grid">
                <div class="files-empty w-muted">正在載入…</div>
            </div>

            <p class="files-hint w-muted">經 Cloudflare 連線時，單一檔案上傳上限 100 MB；大檔案請改用 Tailscale 內網連線。</p>
        </div>
    </div>
</div>
