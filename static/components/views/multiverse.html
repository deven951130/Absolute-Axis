<!-- Absolute Axis - 多重宇宙（Minecraft 伺服器）。玻璃小工具版面；multiverse.js 更新內容，保留所有 id -->
<div id="view-multiverse" class="view-section">

    <!-- 狀態列 -->
    <section id="mv-status-banner" class="widget mv-banner" aria-live="polite">
        <span id="mv-banner-dot" class="mv-dot"></span>
        <div class="mv-banner-text">
            <p id="mv-banner-title" class="mv-banner-title">狀態偵測中…</p>
            <p id="mv-banner-sub" class="w-muted mv-banner-sub">正在建立連線…</p>
        </div>
        <span class="w-muted mv-updated">更新於 <span id="mv-last-update">--:--:--</span></span>
        <button type="button" class="round-btn sm" aria-label="重新整理" onclick="loadMultiverse()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg></button>
    </section>

    <div class="mv-grid">
        <!-- 伺服器 -->
        <section class="widget mv-card">
            <p class="w-cap" style="color:#20A6A6"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>伺服器</p>
            <div class="mv-rows">
                <div class="mv-info-row"><span class="mv-label">名稱</span><span id="mv-name" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">版本</span><span id="mv-version" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">Java</span><span id="mv-java" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">Screen</span><span id="mv-screen" class="mv-value mv-mono">--</span></div>
                <div class="mv-info-row"><span class="mv-label">執行狀態</span><span id="mv-uptime" class="mv-value">--</span></div>
            </div>
        </section>

        <!-- 連線 -->
        <section class="widget mv-card">
            <p class="w-cap" style="color:#3E7BFA"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>連線位址</p>
            <div class="mv-addr">
                <span class="mv-label">家中區網</span>
                <div class="mv-addr-row"><code id="mv-lan">--</code><button type="button" class="btn btn-outline btn-sm" onclick="mvCopy('mv-lan')">複製</button></div>
            </div>
            <div class="mv-addr">
                <span class="mv-label">外網（IP）</span>
                <div class="mv-addr-row"><code id="mv-wan">--</code><button type="button" class="btn btn-outline btn-sm" onclick="mvCopy('mv-wan')">複製</button></div>
            </div>
            <div class="mv-addr">
                <span class="mv-label">固定網域</span>
                <div class="mv-addr-row"><code id="mv-ddns">--</code><button type="button" class="btn btn-outline btn-sm" onclick="mvCopy('mv-ddns')">複製</button></div>
            </div>
        </section>

        <!-- 硬體 -->
        <section class="widget mv-card">
            <p class="w-cap" style="color:#8E8E96"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"></rect><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"></path></svg>硬體</p>
            <div class="mv-rows">
                <div class="mv-info-row"><span class="mv-label">容器記憶體</span><span id="mv-ram" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">JVM 堆積</span><span id="mv-jvm" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">CPU</span><span id="mv-cpu" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">容器</span><span id="mv-container" class="mv-value">--</span></div>
            </div>
            <div class="mv-pulse">
                <span id="mv-pulse-ring" class="mv-ring"></span>
                <span id="mv-pulse-label" class="mv-pulse-label">離線</span>
            </div>
        </section>

        <!-- 模組包簡介 -->
        <section class="widget w2 mv-card mv-desc">
            <p class="w-cap" style="color:#FF9F43"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M8 9h8M8 13h5"></path></svg>模組包說明
                <button id="mv-edit-desc-btn" type="button" class="w-more" style="display:none;" onclick="window.toggleEditDesc(true)">編輯</button></p>
            <div id="mv-desc-display" class="mv-desc-text">載入中…</div>
            <div id="mv-desc-edit-area" class="mv-desc-edit" style="display:none;">
                <textarea id="mv-desc-textarea" class="t-input" rows="6"></textarea>
                <div class="mv-desc-actions">
                    <button type="button" class="btn btn-outline btn-sm" onclick="window.toggleEditDesc(false)">取消</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="window.saveDesc()">儲存</button>
                </div>
            </div>
        </section>

        <!-- 模組包 -->
        <section class="widget mv-card">
            <p class="w-cap" style="color:#2FB463"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 19h16"></path></svg>模組包</p>
            <div class="mv-rows">
                <div class="mv-info-row"><span class="mv-label">伺服器端</span><span id="mv-server-pack-name" class="mv-value">--</span></div>
                <div class="mv-info-row"><span class="mv-label">客戶端</span><span id="mv-client-pack-name" class="mv-value">--</span></div>
            </div>
            <button id="mv-download-client-btn" type="button" class="btn btn-primary btn-block" onclick="window.downloadClientPack()" disabled>下載客戶端模組包</button>
            <div id="mv-admin-pack-controls" class="mv-admin" style="display:none;">
                <span class="mv-label">管理員</span>
                <button type="button" class="btn btn-outline btn-block" onclick="window.triggerUpload('server')">上傳伺服器包（.zip）</button>
                <button type="button" class="btn btn-outline btn-block" onclick="window.triggerUpload('client')">上傳客戶端包（.zip）</button>
                <button type="button" class="btn btn-danger btn-block" onclick="window.uninstallServerPack()">卸載伺服器模組包</button>
                <input type="file" id="mv-file-input" accept=".zip" style="display:none;" onchange="window.handleFileSelected(this)">
            </div>
        </section>
    </div>

    <!-- 模組包函式庫（管理員） -->
    <section id="mv-pack-library-section" class="mv-section" style="display:none;">
        <div class="list-head">
            <h3 class="card-h">模組包函式庫</h3>
            <span class="w-muted mv-hint">切換部署時會先保存目前的世界存檔，並自動重啟伺服器。</span>
        </div>
        <div id="mv-pack-list" class="ios-list"><div class="ios-row static"><span class="ios-label ios-muted">載入中…</span></div></div>
    </section>

    <!-- 指令控制台（管理員） -->
    <section id="mv-console-section" class="mv-section" style="display:none;">
        <div class="list-head">
            <h3 class="card-h">指令控制台</h3>
            <span class="w-muted mv-hint">經 SSH＋screen 送出；每一筆都會記在稽核日誌。</span>
        </div>
        <div class="widget mv-console">
            <div id="mv-cmd-log" class="mv-log">
                <div class="mv-log-sys">控制台就緒：輸入 Minecraft 指令後按 Enter 送出。</div>
            </div>
            <div class="mv-cmd-row">
                <span class="mv-prompt">&gt;</span>
                <input type="text" id="mv-cmd-input" autocomplete="off" spellcheck="false" placeholder="例如：say 大家好 / time set day / kick 玩家名稱"
                    onkeypress="if(event.key==='Enter') sendMCCommand()">
                <button type="button" class="btn btn-primary btn-sm" onclick="sendMCCommand()">送出</button>
            </div>
        </div>
    </section>

    <!-- 快速指令（管理員） -->
    <section id="mv-quick-panel" class="mv-section" style="display:none;">
        <div class="list-head"><h3 class="card-h">快速指令</h3></div>
        <div class="mv-quick">
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('time set day')">白天</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('time set night')">夜晚</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('weather clear')">晴天</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('weather rain')">下雨</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('difficulty peaceful')">和平難度</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('difficulty normal')">普通難度</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('difficulty hard')">困難難度</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="mvQuickCmd('list')">玩家列表</button>
        </div>
    </section>
</div>
