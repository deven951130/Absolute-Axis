<!-- Absolute Axis - NAS 管理（玻璃小工具；nas-mgnt.js 每 30 秒更新：硬碟卡片與儲存池依 API 動態產生，所有值用 textContent） -->
<div id="view-nas-mgnt" class="view-section">
    <div class="nas-grid">
        <section class="widget w2 nas-pool" aria-labelledby="nas-pool-title">
            <p id="nas-pool-title" class="w-cap" style="color:#2FB463"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>儲存池</p>
            <div id="nas-pools" class="nas-rows">
                <p class="w-muted nas-info">偵測中…</p>
            </div>
        </section>

        <section class="widget nas-details" aria-labelledby="nas-details-title">
            <p id="nas-details-title" class="w-cap" style="color:#FF9F43"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l7 4"></path><circle cx="12" cy="12" r="9"></circle></svg>空間用途
                <button type="button" class="w-more" onclick="refreshNASHardware()">重新整理</button></p>
            <div class="nas-rows">
                <div class="nas-row"><span class="nas-dot" style="background:#8E8E96"></span><span>核心系統</span><b id="det-core">--</b></div>
                <div class="nas-row"><span class="nas-dot" style="background:#2E9BF0"></span><span>成員檔案（NAS）</span><b id="det-user">--</b></div>
                <div class="nas-row"><span class="nas-dot" style="background:#5E5CE6"></span><span>Docker（映像、容器、volume）</span><b id="det-docker">--</b></div>
            </div>
            <p class="w-muted nas-note">每 30 秒自動更新磁碟健康（S.M.A.R.T）；休眠中的硬碟不讀取，避免把它叫醒。</p>
        </section>

        <div id="nas-disks" class="nas-disks" aria-live="polite">
            <section class="widget nas-disk"><p class="w-muted nas-info">讀取硬碟中…</p></section>
        </div>

        <p id="nas-container-note" class="w-muted nas-note nas-wide" hidden>主控台跑在容器裡：主機另外掛載的硬碟，容器內看不到它的掛載點，所以只能顯示容量與健康狀態，算不出已用空間。</p>
    </div>
</div>
