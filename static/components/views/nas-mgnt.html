<!-- Absolute Axis - NAS 管理（玻璃小工具；nas-mgnt.js 每 30 秒更新，所有值用 textContent） -->
<div id="view-nas-mgnt" class="view-section">
    <div class="nas-grid">
        <section class="widget nas-disk" aria-labelledby="disk-0-name">
            <p class="w-cap" style="color:#8E8E96"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="13" width="17" height="7" rx="2"></rect><path d="M5.5 13l2.5-8h8l2.5 8M16.5 16.5h.01"></path></svg><span id="disk-0-dev">系統碟</span></p>
            <div class="nas-disk-top">
                <h3 id="disk-0-name" class="nas-disk-name">讀取中…</h3>
                <span id="disk-0-status" class="pill">—</span>
            </div>
            <div class="nas-big"><b id="disk-0-val" class="w-big">--%</b><span class="w-muted">已使用</span></div>
            <div class="w-bar"><div id="disk-0-bar" style="width:0%"></div></div>
            <p id="disk-0-info" class="w-muted nas-info">偵測中…</p>
            <span id="disk-0-temp" hidden></span>
        </section>

        <section class="widget nas-disk" aria-labelledby="disk-1-name">
            <p class="w-cap" style="color:#2E9BF0"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="13" width="17" height="7" rx="2"></rect><path d="M5.5 13l2.5-8h8l2.5 8M16.5 16.5h.01"></path></svg><span id="disk-1-dev">資料碟</span></p>
            <div class="nas-disk-top">
                <h3 id="disk-1-name" class="nas-disk-name">讀取中…</h3>
                <span id="disk-1-status" class="pill">—</span>
            </div>
            <div class="nas-big"><b id="disk-1-val" class="w-big">--%</b><span class="w-muted">已使用</span></div>
            <div class="w-bar"><div id="disk-1-bar" style="width:0%"></div></div>
            <p id="disk-1-info" class="w-muted nas-info">偵測中…</p>
            <span id="disk-1-temp" hidden></span>
        </section>

        <section class="widget nas-details" aria-labelledby="nas-details-title">
            <p id="nas-details-title" class="w-cap" style="color:#FF9F43"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l7 4"></path><circle cx="12" cy="12" r="9"></circle></svg>空間用途
                <button type="button" class="w-more" onclick="refreshNASHardware()">重新整理</button></p>
            <div class="nas-rows">
                <div class="nas-row"><span class="nas-dot" style="background:#8E8E96"></span><span>核心系統</span><b id="det-core">--</b></div>
                <div class="nas-row"><span class="nas-dot" style="background:#2E9BF0"></span><span>成員檔案（NAS）</span><b id="det-user">--</b></div>
                <div class="nas-row"><span class="nas-dot" style="background:#5E5CE6"></span><span>Docker 掛載區</span><b id="det-docker">--</b></div>
            </div>
            <p class="w-muted nas-note">每 30 秒自動更新磁碟健康（S.M.A.R.T）。</p>
        </section>

        <section class="widget w2 nas-pool" aria-labelledby="raid-name">
            <p class="w-cap" style="color:#2FB463"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>儲存池</p>
            <div class="nas-pool-row">
                <div class="nas-pool-text">
                    <h3 id="raid-name" class="nas-disk-name">儲存池</h3>
                    <p id="raid-type" class="w-muted">—</p>
                </div>
                <span id="raid-status" class="pill">—</span>
            </div>
            <div class="w-bar"><div id="raid-bar" style="width:100%"></div></div>
        </section>
    </div>
</div>
