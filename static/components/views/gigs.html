<!-- Absolute Axis - 接案中樞（gigs.js 以 DOM＋textContent 產生清單；訪客也能發案，所有文字都不插入 HTML） -->
<div id="view-gigs" class="view-section">
    <div class="page-wrap wide">
        <div class="page-head">
            <div>
                <p class="w-muted page-sub page-lead">發佈委託、承接案件與追蹤進度。</p>
            </div>
        </div>
        <div class="two-pane">
            <section class="form-card" aria-labelledby="gig-form-title">
                <h3 id="gig-form-title" class="card-h">發佈案件</h3>
                <div class="ios-group ios-form-rows">
                    <label><span>名稱</span><input type="text" id="gig-title-input" maxlength="100" placeholder="案件名稱"></label>
                    <label class="ta"><span>需求</span><textarea id="gig-desc-input" rows="5" placeholder="需求內容與驗收標準"></textarea></label>
                    <label><span>預算</span><input type="number" id="gig-budget-input" min="1" inputmode="numeric" placeholder="新台幣，例如 5000"></label>
                </div>
                <div id="gig-contact-container" style="display:none;">
                    <p class="ios-caption">未登入的訪客請留下聯絡方式</p>
                    <div class="ios-group ios-form-rows">
                        <label><span>聯絡</span><input type="text" id="gig-contact-input" maxlength="100" placeholder="Email、手機或 Line ID"></label>
                    </div>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="submitGig()">發佈</button>
            </section>
            <section aria-labelledby="gig-list-title">
                <div class="list-head">
                    <h3 id="gig-list-title" class="card-h">委託案件</h3>
                    <div class="seg" role="group" aria-label="案件狀態">
                        <button type="button" id="tab-gig-active" aria-pressed="true" onclick="switchGigTab('active')">進行中</button>
                        <button type="button" id="tab-gig-completed" aria-pressed="false" onclick="switchGigTab('completed')">已完成</button>
                    </div>
                    <button type="button" class="round-btn sm" aria-label="重新整理" onclick="loadGigs()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg></button>
                </div>
                <div id="gigs-list-container" class="post-list"><p class="w-muted">載入中…</p></div>
            </section>
        </div>
    </div>
</div>
