<!-- Absolute Axis - Admin View Module（帳號管理；admin.js 以 DOM＋textContent 產生清單，帳號名稱不插入 HTML） -->
<div id="view-admin" class="view-section">
    <div class="page-wrap">
        <div class="page-head">
            <div>
                <p class="w-muted page-sub page-lead">核准註冊申請、調整角色與儲存空間。</p>
            </div>
            <button type="button" class="btn btn-primary" onclick="document.getElementById('modal-create-user').style.display='flex'">＋ 新增成員</button>
        </div>
        <div class="seg page-seg" role="group" aria-label="依狀態篩選">
            <button type="button" class="admin-tab" data-filter="all" aria-pressed="true" onclick="filterUsers('all', this)">全部</button>
            <button type="button" class="admin-tab" data-filter="Pending" aria-pressed="false" onclick="filterUsers('Pending', this)">等待中<span id="admin-pending-count" class="seg-count" hidden></span></button>
            <button type="button" class="admin-tab" data-filter="Approved" aria-pressed="false" onclick="filterUsers('Approved', this)">已核准</button>
            <button type="button" class="admin-tab" data-filter="Rejected" aria-pressed="false" onclick="filterUsers('Rejected', this)">已拒絕</button>
        </div>
        <div id="user-table-body" class="ios-list" aria-live="polite"></div>
    </div>
</div>
