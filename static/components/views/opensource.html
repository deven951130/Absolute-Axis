<!-- Absolute Axis - 開源分享（opensource.js 以 DOM＋textContent 產生專案卡片；連結只接受 http(s)） -->
<div id="view-opensource" class="view-section">
    <div class="page-wrap wide">
        <div class="page-head">
            <p id="os-subtitle" class="w-muted page-sub page-lead">自動同步開發者的公開專案與開源成果</p>
            <div class="page-actions">
                <button id="os-add-repo-btn" type="button" class="btn btn-primary" style="display:none;" onclick="window.showAddRepoModal()">＋ 新增專案</button>
                <a id="os-author-url" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="display:none;">GitHub 主頁</a>
            </div>
        </div>
        <div id="repos-grid" class="repo-grid"><p class="w-muted post-empty">載入中…</p></div>
    </div>

    <!-- 新增專案（管理員） -->
    <div id="os-add-repo-modal" class="sheet-overlay" style="display:none;" onclick="if(event.target === this) window.hideAddRepoModal()">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="os-add-title">
            <div class="sheet-head">
                <h3 id="os-add-title" class="card-h">新增開源專案</h3>
                <button type="button" class="round-btn sm" aria-label="關閉" onclick="window.hideAddRepoModal()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </div>
            <p class="ios-caption">從 GitHub 連結匯入</p>
            <div class="sheet-import">
                <input type="text" id="os-import-url" class="t-input" placeholder="https://github.com/帳號/專案">
                <button id="os-import-btn" type="button" class="btn btn-outline" onclick="window.importFromUrl()">解析</button>
            </div>
            <p class="ios-caption">專案資訊</p>
            <div class="ios-group ios-form-rows sheet-form">
                <label><span>名稱</span><input type="text" id="os-repo-name" placeholder="Absolute-Axis"></label>
                <label><span>完整</span><input type="text" id="os-repo-fullname" placeholder="帳號/專案"></label>
                <label><span>連結</span><input type="text" id="os-repo-url" placeholder="https://github.com/…"></label>
                <label><span>語言</span><input type="text" id="os-repo-lang" placeholder="Python / JavaScript"></label>
                <label class="ta"><span>描述</span><textarea id="os-repo-desc" rows="3" placeholder="一句話介紹這個專案"></textarea></label>
            </div>
            <button type="button" class="btn btn-primary btn-block" onclick="window.submitAddRepo()">新增專案</button>
        </div>
    </div>
</div>
