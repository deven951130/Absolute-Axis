services:
  axis-server:
    build: .
    container_name: axis-server
    restart: always
    network_mode: host
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TZ=Asia/Taipei
      # 綁定至 Tailscale IP (從 .env 讀取，預設為全監聽)
      - HOST_IP=${HOST_IP:-0.0.0.0}
      # Proxmox（選用）：沒設定 PVE_HOST＝不使用 Proxmox
      - PVE_HOST=${PVE_HOST:-}
      - PVE_CONSOLE_HOST=${PVE_CONSOLE_HOST:-}
      - PVE_VM_STORAGE=${PVE_VM_STORAGE:-}
      - PVE_USER=${PVE_USER:-root@pam}
      - PVE_PASS=${PVE_PASS:-}
      # 建議改用最小權限的 API token（設定後優先使用，不再需要 root 密碼呼叫 API）
      - PVE_TOKEN_ID=${PVE_TOKEN_ID:-}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET:-}
      - PVE_CA_FILE=${PVE_CA_FILE:-}
      - MC_SSH_USER=${MC_SSH_USER:-root}
      - MC_SSH_PASS=${MC_SSH_PASS:-}
      # Minecraft 模組（選用）：沒設定 MC_HOST＝不使用
      - MC_HOST=${MC_HOST:-}
      # 用下面內建的 Minecraft 容器時填 axis-mc：指令走 rcon-cli、模組包直接換 ./minecraft-data 裡的 zip（不用 SSH）
      - MC_CONTAINER=${MC_CONTAINER:-}
      - MC_PORT=${MC_PORT:-}
      - MC_PUBLIC_HOST=${MC_PUBLIC_HOST:-}
      - BLYNK_TOKEN=${BLYNK_TOKEN:-}
      # DeviceHub 模組（DeviceHub repo: docs/spec/integration-api.md）
      - DEVICEHUB_URL=${DEVICEHUB_URL:-}
      - DEVICEHUB_TOKEN=${DEVICEHUB_TOKEN:-}
      - DEVICEHUB_CONTROL_TOKEN=${DEVICEHUB_CONTROL_TOKEN:-}
      # 必填、不得有預設值：預設值寫在 repo 裡等於公開，任何人都能偽造管理員登入
      - AXIS_JWT_SECRET=${AXIS_JWT_SECRET:?請在 .env 設定 AXIS_JWT_SECRET，產生方式見 .env.example}
      # 資料庫裡還沒有任何管理員時，用這組帳密建立第一個管理員（帳號預設 admin）；密碼沒有預設值
      - AXIS_ADMIN_USER=${AXIS_ADMIN_USER:-}
      - AXIS_ADMIN_PASS=${AXIS_ADMIN_PASS:-}
      - AXIS_BASE_PATH=/app
      - AXIS_SYS_ROOT=/
      - AXIS_NAS_PATH=/app/nas
    volumes:
      - .:/app
      - ./nas:/app/nas
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
    privileged: true
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 選用：Cloudflare Tunnel（從外面連線）。在 .env 設 CLOUDFLARE_TUNNEL_TOKEN 與 COMPOSE_PROFILES=tunnel 才會啟動
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    container_name: axis-cloudflared
    restart: always
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run

  # 選用：Minecraft 伺服器。在 .env 設 COMPOSE_PROFILES=minecraft 才會啟動（可與 tunnel 並列：tunnel,minecraft）
  minecraft-server:
    # Forge 1.20.x 需要 Java 17（latest 是 Java 25，會讓 Forge 模組包起不來）
    image: itzg/minecraft-server:java17
    profiles: ["minecraft"]
    container_name: axis-mc
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      # 模組包伺服器：TYPE／版本在 .env 設定（MC_TYPE、MC_VERSION、MC_FORGE_VERSION）
      TYPE: "${MC_TYPE:-FORGE}"
      VERSION: "${MC_VERSION:-LATEST}"
      FORGE_VERSION: "${MC_FORGE_VERSION:-}"
      # 伺服器包 zip（容器內路徑，例如 /data/server.zip）：第一次啟動與 zip 更新時自動解壓到 /data
      GENERIC_PACK: "${MC_SERVER_PACK:-}"
      # 世界資料夾名稱固定（不受伺服器包內附的 server.properties 影響），多重宇宙頁切換模組包時靠它搬世界
      LEVEL: "${MC_LEVEL:-world}"
      # 堆積上限要比容器記憶體上限少 1.5 GB 左右，留給 JVM 本身，否則會被 OOM 砍掉
      INIT_MEMORY: "4G"
      MAX_MEMORY: "9G"
      USE_AIKAR_FLAGS: "true"
      # 大型模組包載入很久：停用內建 watchdog（max-tick-time=-1），避免被判定卡死而強制結束（見 UPDATE_LOG）
      MAX_TICK_TIME: "-1"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 10.5G
    volumes:
      - ./minecraft-data:/data
