version: '3.8'

services:
  axis-server:
    build: .
    container_name: axis-server
    restart: always
    network_mode: host
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TZ=Asia/Taipei
      # 綁定至 Tailscale IP (從 .env 讀取，預設為全監聽)
      - HOST_IP=${HOST_IP:-0.0.0.0}
      - PVE_HOST=${PVE_HOST:-192.168.0.138}
      - PVE_USER=${PVE_USER:-root@pam}
      - PVE_PASS=${PVE_PASS}
      # 建議改用最小權限的 API token（設定後優先使用，不再需要 root 密碼呼叫 API）
      - PVE_TOKEN_ID=${PVE_TOKEN_ID:-}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET:-}
      - PVE_CA_FILE=${PVE_CA_FILE:-}
      - MC_SSH_USER=${MC_SSH_USER:-root}
      - MC_SSH_PASS=${MC_SSH_PASS:-}
      - BLYNK_TOKEN=${BLYNK_TOKEN}
      # DeviceHub 模組（DeviceHub repo: docs/spec/integration-api.md）
      - DEVICEHUB_URL=${DEVICEHUB_URL:-http://192.168.0.50:8080}
      - DEVICEHUB_TOKEN=${DEVICEHUB_TOKEN:-}
      - DEVICEHUB_CONTROL_TOKEN=${DEVICEHUB_CONTROL_TOKEN:-}
      # 必填、不得有預設值：預設值寫在 repo 裡等於公開，任何人都能偽造管理員登入
      - AXIS_JWT_SECRET=${AXIS_JWT_SECRET:?請在 .env 設定 AXIS_JWT_SECRET，產生方式見 .env.example}
      # 只在第一次建立 sparkle 帳號時使用；沒有預設值
      - AXIS_ADMIN_PASS=${AXIS_ADMIN_PASS:-}
      - AXIS_BASE_PATH=/app
      - AXIS_SYS_ROOT=/
      - AXIS_NAS_PATH=/app/nas
    volumes:
      - .:/app
      - ./nas:/app/nas
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
    privileged: true
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: axis-cloudflared
    restart: always
    network_mode: host
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

  minecraft-server:
    image: itzg/minecraft-server
    container_name: axis-mc
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      # 使用 CUSTOM 模式，這樣它會直接執行資料夾內的啟動檔或主程式
      TYPE: "CUSTOM"
      CUSTOM_JAR_EXEC: "bash start.sh" # 如果是 Forge/Fabric 整合包通常會有 start.sh
      # 若沒有 start.sh，itzg 映像檔也有自動化尋找機制
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 10.5G
    volumes:
      - ./minecraft-data:/data
